name: FoodieGo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Validate Oracle SQL Scripts (DDL & Seed Data)
        run: |
          echo "Validating SQL Schema syntax and constraints..."
          test -f db/schema.sql || (echo "db/schema.sql missing!" && exit 1)
          test -f db/seed_data.sql || (echo "db/seed_data.sql missing!" && exit 1)
          echo "Schema contains 16 3NF relations:"
          grep -i "CREATE TABLE" db/schema.sql | wc -l

      - name: Install Backend Dependencies
        working-directory: ./server
        run: pnpm install

      - name: Run Backend Automated Smoke Tests
        working-directory: ./server
        run: node tests/api.test.js

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: pnpm install

      - name: Build Frontend Application
        working-directory: ./client
        run: pnpm run build

      - name: Verify Build Artifacts
        run: |
          test -d client/dist || (echo "Frontend build failed!" && exit 1)
          echo "✅ Full CI/CD build & test verification completed successfully!"
